[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
cache_path = "cache/forge"
libs = ["node_modules"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
dynamic_test_linking = false
fuzz.runs = 512
invariant.runs = 128
invariant.depth = 64
invariant.fail_on_revert = false
fs_permissions = [{ access = "write", path = "../apps/clank-trade/.env" }]
auto_detect_remappings = false

remappings = [
  "forge-std/=node_modules/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@uniswap/v4-core/=node_modules/@uniswap/v4-core/",
  "@uniswap/v4-periphery/=node_modules/@uniswap/v4-periphery/",
  "permit2/=node_modules/permit2/",
]

[profile.production]
optimizer = true
optimizer_runs = 200
via_ir = true

[rpc_endpoints]
local = "http://127.0.0.1:8545"
robinhood = "${ROBINHOOD_RPC_URL}"

[lint]
lint_on_build = false
